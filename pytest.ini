[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    ui: UI-level test cases
    functional: Functional/behavioral test cases
    auth: Authentication/session test cases
    positive: Positive/happy-path test cases
    negative: Negative test cases
    smoke: Smoke test suite
    high: High priority test case
    medium: Medium priority test case
    low: Low priority test case
 
; Excel column -> pytest mapping (keep updated as you add cases):
;   Test Type        -> @pytest.mark.ui / functional / auth
;   Positive/Negative -> @pytest.mark.positive / negative
;   Priority          -> @pytest.mark.high / medium / low
;   Notes             -> @pytest.mark.smoke where noted "Smoke test"
;   Auto/Manual = Manual -> @pytest.mark.skip(reason="...Notes column...")
;   Test Case ID      -> included in the test function name + docstring
 

# Output
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s - %(levelname)s - %(message)s

# Allure report output directory
addopts = --alluredir=allure_results
